apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: argocd
  namespace: argocd
spec:
  clientID: argocd
  # The UI, CLI and mobile app sign in with PKCE and no client secret.
  isPublic: true
  pkceEnabled: true
  callbackUrls:
    - https://argocd.whyredfire.dev/auth/callback
    - https://argocd.whyredfire.dev/pkce/verify
    - http://localhost:8085/auth/callback
    - argocd://auth/callback
  allowedUserGroups:
    - name: admins
      namespace: pocket-id
  launchUrl: https://argocd.whyredfire.dev
  secret:
    enabled: false
