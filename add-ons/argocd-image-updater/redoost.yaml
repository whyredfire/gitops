apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: redoost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  applicationRefs:
    - namePattern: redoost
      images:
        - alias: api
          imageName: ghcr.io/whyredfire/redoost-api:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: api.image.repository
              tag: api.image.tag
        - alias: frontend
          imageName: ghcr.io/whyredfire/redoost-frontend:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: frontend.image.repository
              tag: frontend.image.tag
