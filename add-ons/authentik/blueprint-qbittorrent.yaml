apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-qbittorrent
  namespace: authentik
data:
  qbittorrent.yaml: |
    version: 1
    metadata:
      name: qBittorrent
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: qbittorrent-provider
        identifiers:
          name: qbittorrent
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://qbit.whyredfire.dev
      - model: authentik_core.application
        id: qbittorrent
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          provider: !KeyOf qbittorrent-provider
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          target: !KeyOf qbittorrent
        attrs:
          group: !Find [authentik_core.group, [name, admins]]
