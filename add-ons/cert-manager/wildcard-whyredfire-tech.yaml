apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-whyredfire-tech
  namespace: traefik
spec:
  secretName: wildcard-whyredfire-tech
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.whyredfire.tech"
