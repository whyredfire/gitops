apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: grafana-dashboard-raspberry-pi
  namespace: monitoring
data:
  raspberry-pi.json: |
    {
      "uid": "raspberry-pi",
      "title": "Raspberry Pi",
      "editable": true,
      "schemaVersion": 41,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "tags": [],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(container_cpu_usage_seconds_total, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(container_cpu_usage_seconds_total, namespace)",
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Node",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "CPU",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Memory",
