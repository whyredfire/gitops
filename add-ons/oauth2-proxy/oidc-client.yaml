apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  clientID: oauth2-proxy
  pkceEnabled: true
  callbackUrls:
    - https://garage.whyredfire.dev/oauth2/callback
    - https://pgweb.whyredfire.dev/oauth2/callback
    - https://qbit.whyredfire.dev/oauth2/callback
  allowedUserGroups:
    - name: admins
      namespace: pocket-id
