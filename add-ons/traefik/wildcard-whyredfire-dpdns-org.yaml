apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-whyredfire-dpdns-org
  namespace: traefik
spec:
  dnsNames:
    - '*.whyredfire.dpdns.org'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    rotationPolicy: Always
  secretName: wildcard-whyredfire-dpdns-org
