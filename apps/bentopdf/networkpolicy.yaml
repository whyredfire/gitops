apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bentopdf
  namespace: bentopdf
spec:
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bentopdf
  policyTypes:
    - Ingress
    - Egress
