apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: garage-ui
  namespace: garage
spec:
  hostnames:
    - garage.whyredfire.dev
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
      matches:
        - path:
            type: PathPrefix
            value: /oauth2/
    - backendRefs:
        - name: garage-ui
          port: 80
      filters:
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-proxy
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /