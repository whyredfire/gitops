apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage
  namespace: garage
spec:
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redoost
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3900
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redoost
      ports:
        - port: 3902
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage-ui
      ports:
        - port: 3903
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes:
    - Ingress
    - Egress
