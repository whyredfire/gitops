apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubis
    spec:
      containers:
        - env:
            - name: BIND
              value: :8080
            - name: REDIRECT_DOMAINS
              value: gitea.whyredfire.dev
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  key: ED25519_PRIVATE_KEY_HEX
                  name: anubis-key
            - name: POLICY_FNAME
              value: /etc/anubis/botPolicy.yaml
            - name: TARGET
              value: http://gitea-http:3000
          image: ghcr.io/techarohq/anubis:v1.28.2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          name: anubis
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/anubis
              name: policy
              readOnly: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: anubis
          name: policy
