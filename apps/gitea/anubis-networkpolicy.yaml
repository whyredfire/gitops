apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anubis
  namespace: gitea
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 3000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anubis
  policyTypes:
    - Ingress
    - Egress
