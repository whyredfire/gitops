apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: gitea
  namespace: gitea
spec:
  clientID: gitea
  callbackUrls:
    - https://gitea.whyredfire.dev/user/oauth2/pocket-id/callback
  allowedUserGroups:
    - name: admins
      namespace: pocket-id
  launchUrl: https://gitea.whyredfire.dev
  secret:
    name: gitea-oauth
    keys:
      clientID: key
      clientSecret: secret
