apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: qbittorrent
  namespace: jellyfin
spec:
  hostnames:
    - qbit.whyredfire.dev
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
      matches:
        - path:
            type: PathPrefix
            value: /oauth2/
    - backendRefs:
        - name: qbittorrent
          port: 8080
      filters:
        - extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-proxy
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /