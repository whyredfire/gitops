apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustbin
  namespace: rustbin
spec:
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustbin
  policyTypes:
    - Ingress
    - Egress
