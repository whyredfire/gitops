apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scriptscribe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@gitea-ssh.whyredfire.tech:whyredfire/gitops
    targetRevision: main
    path: manifests/scriptscribe
  destination:
    server: https://kubernetes.default.svc
    namespace: scriptscribe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
