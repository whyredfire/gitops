apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telegram-autoregexbot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.whyredfire.tech/whyredfire/telegram-autoregexbot
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: telegram
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
