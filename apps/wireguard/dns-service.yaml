apiVersion: v1
kind: Service
metadata:
  name: vpn-dns
  namespace: kube-system
spec:
  externalIPs:
    - 192.168.2.5
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
  selector:
    k8s-app: kube-dns
