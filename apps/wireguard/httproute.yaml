apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: wireguard-admin
  namespace: wireguard
spec:
  hostnames:
    - wg-admin.whyredfire.dev
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - backendRefs:
        - name: wireguard-admin
          port: 51821
      matches:
        - path:
            type: PathPrefix
            value: /
