apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
    argocd.argoproj.io/sync-wave: "3"
  name: pgweb
  namespace: argocd
spec:
  destination:
    namespace: pgweb
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/pgweb
    repoURL: https://gitea.whyredfire.dev/whyredfire/gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
