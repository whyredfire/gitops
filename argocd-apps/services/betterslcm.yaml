apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: betterslcm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DK10WS/SLCM_APP.git
    targetRevision: web
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: betterslcm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
