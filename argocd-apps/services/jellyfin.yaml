apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: "2.7.0"
      helm:
        values: |
          service:
            type: ClusterIP
            port: 8096
          ingress:
            enabled: false
          persistence:
            config:
              enabled: true
              size: 2Gi
            media:
              enabled: true
              type: hostPath
              hostPath: /srv/media
    - repoURL: https://gitea.whyredfire.dev/whyredfire/gitops.git
      targetRevision: main
      path: apps/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
