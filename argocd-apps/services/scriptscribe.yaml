apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scriptscribe
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/whyredfire/scriptscribe
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scriptscribe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
