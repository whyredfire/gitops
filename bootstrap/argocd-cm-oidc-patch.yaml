apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  oidc.config: |
    name: Pocket ID
    issuer: https://auth.whyredfire.dev
    clientID: argocd
    enablePKCEAuthentication: true
    requestedScopes:
      - openid
      - profile
      - email
      # argocd-rbac-cm maps the admins group
      - groups
