apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  # Image Updater pins digests on the live Applications
  ignoreDifferences:
    - group: argoproj.io
      jqPathExpressions:
        - .spec.sources[]?.helm.parameters
        - .spec.source.kustomize.images
      kind: Application
  project: default
  source:
    path: argocd-apps
    repoURL: https://gitea.whyredfire.dev/whyredfire/gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
