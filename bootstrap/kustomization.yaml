apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/install.yaml
  - argocd-root-app
patches:
  - target:
      kind: Service
      name: argocd-server
    path: argocd-server-nodeport-patch.yaml
  - target:
      kind: ConfigMap
      name: argocd-cm
    path: argocd-cm-application-health-patch.yaml
