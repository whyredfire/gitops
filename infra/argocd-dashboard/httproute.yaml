apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: argocd-dashboard
  namespace: argocd
spec:
  hostnames:
    - argo.whyredfire.dev
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - backendRefs:
        - name: anubis
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
