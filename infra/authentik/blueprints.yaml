apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # Google is the only way in: its source has no enrollment flow, so a Google
  # account can only log in when a user with the same email already exists.
  google-login.yaml: |
    version: 1
    metadata:
      name: Google login
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            path: default/flow-default-authentication-flow.yaml
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            path: default/flow-default-source-authentication.yaml
          required: true
      - model: authentik_core.group
        id: admins
        identifiers:
          name: admins
        attrs:
          is_superuser: true
      - model: authentik_core.user
        identifiers:
          username: whyredfire
        attrs:
          email: whyredfire@gmail.com
          groups:
            - !KeyOf admins
          name: Karan Parashar
      - model: authentik_sources_oauth.oauthsource
        id: google
        identifiers:
          slug: google
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          consumer_key: !Env GOOGLE_CLIENT_ID
          consumer_secret: !Env GOOGLE_CLIENT_SECRET
          name: Google
          promoted: true
          provider_type: google
          user_matching_mode: email_link
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          sources:
            - !KeyOf google
